name: watch-reserva
on:
  # 主な起動元は外部の cron サービス（cron-job.org）からの workflow_dispatch。
  # GitHub の定期実行は 2026-11-09 時点でこのリポジトリでは一度も動かなかったが、戻ったときの予備として残す。
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "23日のマスのHTMLをログに出し、画面のスクリーンショットを保存する"
        type: boolean
        default: false
concurrency:                  # 前の実行が終わるまで次を待たせ、state.json の取り合いを防ぐ
  group: watch-reserva
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # 固まっても次の実行を詰まらせない
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-v3-${{ github.run_id }}
          restore-keys: state-v3-   # v3: ×の読み取り方を変えたので、以前の状態は使わない
      - run: python check_cancel.py
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DEBUG: ${{ inputs.debug == true }}  # 手動実行で debug にチェックしたときだけ診断を出す
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-v3-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && inputs.debug == true
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 7
