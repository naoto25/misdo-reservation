name: watch-reserva
on:
  schedule:
    - cron: "*/5 * * * *"   # 5分おき（GitHubの最短）。実際は数分遅れることがある
  workflow_dispatch:
concurrency:                  # 前の実行が終わるまで次を待たせ、state.json の取り合いを防ぐ
  group: watch-reserva
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # 固まっても次の実行を詰まらせない
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-v3-${{ github.run_id }}
          restore-keys: state-v3-   # v3: ×の読み取り方を変えたので、以前の状態は使わない
      - run: python check_cancel.py
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DEBUG: ${{ github.event_name == 'workflow_dispatch' }}  # 手動実行のときだけ診断を出す
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-v3-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 7
